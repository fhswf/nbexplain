[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nbexplain"
version = "0.1.5"
description = "A small IPython cell magic for didactic LLM explanations of notebook code."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "FH SWF" }
]
dependencies = [
  "ipython>=8.0",
  "openai>=1.0",
]
keywords = ["jupyter", "ipython", "notebook", "llm", "education"]
classifiers = [
  "Framework :: IPython",
  "Framework :: Jupyter",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/fhswf/nbexplain"
Repository = "https://github.com/fhswf/nbexplain"
